<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset="0.5" stop-color="#1a1b3a"/><stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.9"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="loop" d="M300,180 m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0"/>
  </defs>

  <rect width="860" height="360" rx="18" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 60H860M0 120H860M0 180H860M0 240H860M0 300H860"/>
    <path d="M86 0V360M172 0V360M258 0V360M344 0V360M430 0V360M516 0V360M602 0V360M688 0V360M774 0V360"/>
  </g>

  <!-- core -->
  <circle cx="300" cy="180" r="70" fill="url(#core)">
    <animate attributeName="r" values="60;78;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="300" y="174" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">AGENT</text>
  <text x="300" y="196" text-anchor="middle" fill="#c4b5fd" font-size="12">LOOP</text>

  <!-- ring -->
  <circle cx="300" cy="180" r="120" fill="none" stroke="url(#ring)" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 300 180" to="360 300 180" dur="24s" repeatCount="indefinite"/>
  </circle>

  <!-- travelling token -->
  <g filter="url(#glow)">
    <circle r="7" fill="#22d3ee"><animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#loop"/></animateMotion></circle>
    <circle r="4" fill="#a855f7" opacity="0.8"><animateMotion dur="6s" begin="-0.25s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
    <circle r="2.5" fill="#6366f1" opacity="0.6"><animateMotion dur="6s" begin="-0.5s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
  </g>

  <!-- nodes: Think(top) Act(right) Observe(bottom) Reflect(left) -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g>
      <rect x="248" y="42" width="104" height="34" rx="17" fill="#1e1b4b" stroke="#818cf8"/>
      <text x="300" y="64" fill="#e0e7ff">🧠 Think</text>
      <animate attributeName="opacity" values="1;0.45;0.45;0.45;1" keyTimes="0;0.2;0.5;0.95;1" dur="6s" begin="-4.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="368" y="163" width="104" height="34" rx="17" fill="#164e63" stroke="#22d3ee"/>
      <text x="420" y="185" fill="#cffafe">🛠 Act</text>
      <animate attributeName="opacity" values="1;0.45;0.45;0.45;1" keyTimes="0;0.2;0.5;0.95;1" dur="6s" begin="-3s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="248" y="284" width="104" height="34" rx="17" fill="#3b0764" stroke="#c084fc"/>
      <text x="300" y="306" fill="#f3e8ff">👀 Observe</text>
      <animate attributeName="opacity" values="1;0.45;0.45;0.45;1" keyTimes="0;0.2;0.5;0.95;1" dur="6s" begin="-1.5s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="128" y="163" width="104" height="34" rx="17" fill="#312e81" stroke="#a5b4fc"/>
      <text x="180" y="185" fill="#e0e7ff">🔁 Reflect</text>
      <animate attributeName="opacity" values="1;0.45;0.45;0.45;1" keyTimes="0;0.2;0.5;0.95;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- connectors to harness panel -->
  <path d="M472 180 C 520 180, 520 110, 560 110" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M472 180 C 520 180, 520 250, 560 250" fill="none" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- harness panel -->
  <g>
    <rect x="560" y="40" width="270" height="280" rx="14" fill="#0b1020" fill-opacity="0.75" stroke="#6366f1" stroke-opacity="0.6"/>
    <circle cx="582" cy="60" r="5" fill="#f87171"/><circle cx="598" cy="60" r="5" fill="#fbbf24"/><circle cx="614" cy="60" r="5" fill="#34d399"/>
    <text x="810" y="64" text-anchor="end" fill="#94a3b8" font-size="11">agent-harness.ts</text>
    <g font-size="13" fill="#cbd5e1">
      <text x="580" y="98"><tspan fill="#c084fc">harness</tspan>.use(<tspan fill="#fbbf24">'mcp'</tspan>)</text>
      <text x="580" y="124"><tspan fill="#c084fc">harness</tspan>.use(<tspan fill="#fbbf24">'skills'</tspan>)</text>
      <text x="580" y="150"><tspan fill="#c084fc">harness</tspan>.use(<tspan fill="#fbbf24">'hooks'</tspan>)</text>
      <text x="580" y="176"><tspan fill="#c084fc">harness</tspan>.use(<tspan fill="#fbbf24">'memory'</tspan>)</text>
      <text x="580" y="202"><tspan fill="#c084fc">harness</tspan>.use(<tspan fill="#fbbf24">'subagents'</tspan>)</text>
      <text x="580" y="228"><tspan fill="#c084fc">harness</tspan>.use(<tspan fill="#fbbf24">'compaction'</tspan>)</text>
      <text x="580" y="262"><tspan fill="#22d3ee">while</tspan> (!done) {</text>
      <text x="596" y="286">await <tspan fill="#34d399">agent.step</tspan>()</text>
      <text x="580" y="308">}<tspan fill="#a855f7">▍<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
    <rect x="572" y="84" width="246" height="20" rx="4" fill="#6366f1" fill-opacity="0.18">
      <animate attributeName="y" values="84;110;136;162;188;214;84" dur="6s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </g>
</svg>
